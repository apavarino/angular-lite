name: Build plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANGULAR_LITE_IDEA: deps/idea-2026.2.4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Check version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('src/main/resources/META-INF/plugin.xml').getroot().findtext('version'))")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag must be v$VERSION to match plugin.xml" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download build dependencies
        shell: bash
        run: |
          mkdir -p deps/idea-2026.2.4
          curl --fail --location --retry 3 https://download.jetbrains.com/idea/idea-2026.2.4.tar.gz -o deps/idea.tar.gz
          echo 'cc6b29ddb82c7dcc656d5c728cefb2c917ac767eb4b8368f1208732846fbb5bd  deps/idea.tar.gz' | sha256sum --check
          tar -xzf deps/idea.tar.gz -C deps/idea-2026.2.4 --strip-components=1
          curl --fail --location --retry 3 https://github.com/redhat-developer/lsp4ij/releases/download/0.21.0/lsp4ij-0.21.0.zip -o deps/lsp4ij.zip
          echo 'dd3d0024a3f160e6bb28164314f5a5af80700fa2d491d853c64d309bd42b8d43  deps/lsp4ij.zip' | sha256sum --check
          unzip -q deps/lsp4ij.zip -d deps
      - name: Build and test syntax colors
        run: |
          python3 build.py
          python3 tests/binding-colors-check.py
      - name: Upload installable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: angular-lite-${{ steps.version.outputs.value }}
          path: dist/angular-lite-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download ZIP and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --dir dist
          mapfile -t files < <(find dist -type f -name 'angular-lite-*.zip')
          [[ ${#files[@]} == 1 ]] || { echo 'Expected exactly one plugin ZIP'; exit 1; }
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[0]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" "${files[0]}" --repo "$GH_REPO" --verify-tag --title "Angular Lite ${TAG#v}" --generate-notes
          fi
